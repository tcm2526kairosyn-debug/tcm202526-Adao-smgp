{% extends "base.html" %}
{% block title %}{{ code }} · {% endblock %}
{% block content %}
<div class="max-w-xl mx-auto py-24 px-4 text-center">
    <p class="text-6xl font-black text-slate-300">{{ code }}</p>
    <h1 class="mt-4 text-2xl font-bold text-slate-800">{{ heading }}</h1>
    <p class="mt-2 text-sm text-slate-500">{{ message }}</p>
    <div class="mt-8 flex justify-center gap-3">
        <a href="{{ url_for('main.index') }}"
           class="bg-slate-800 hover:bg-slate-700 text-white text-sm font-semibold px-5 py-2 rounded-xl transition">
            Voltar ao início
        </a>
        <a href="javascript:history.back()"
           class="px-5 py-2 rounded-xl border border-slate-300 text-slate-600 hover:bg-slate-100 text-sm transition">
            Página anterior
        </a>
    </div>
</div>
{% endblock %}
